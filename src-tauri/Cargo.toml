[package]
name = "cc-visualizer"
version = "1.0.0"
description = "Claude Code System Visualizer"
edition = "2021"

[lib]
name = "cc_visualizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
dirs = "6"
chrono = "0.4"
